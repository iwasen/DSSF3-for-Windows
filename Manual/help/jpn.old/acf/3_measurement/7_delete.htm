<h5>測定データの削除</h5>
ACF測定データを削除する場合は[読込]ボタンをクリックしてください。「測定データ読込み」ダイアログが開きます。削除するデータのフォルダとデータを選択して、[削除]ボタンをクリックします。<br />
<img src="../img/meadurement_9.png" alt="" /><br />
<br />
フォルダを削除する場合は[フォルダ管理ボタン]をクリックしてください。「フォルダ管理」ダイアログが開きます。削除するフォルダを選択して[削除]ボタンをクリックします。<br />
<img src="../img/meadurement_10.png" alt="" /><br />
