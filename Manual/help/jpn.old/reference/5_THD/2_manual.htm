<h5>マニュアル測定</h5>
		指定した周波数と出力レベルにおける高調波成分を測定します。<br /><br />
<b>『マニュアル測定』設定項目の説明</b><br />
<img src="../img/thd_4.png" alt="" /><br />
<table>
	<tr>
		<th>項目</th>
		<th>説明</th>
	</tr>
	<tr>
		<td>測定周波数</td>
		<td>
				スライダーを移動させるか値を直接入力して測定周波数を指定します。</td>
	</tr>
	<tr>
		<td>測定レベル</td>
		<td>
				スライダーを移動させるか値を直接入力して出力レベルを指定します。（最大レベルを0dBとします）</td>
	</tr>
	<tr>
		<td>
				表示設定</td>
		<td>
				「平均化」をチェックすると測定中の歪率を平均化して表示します。</td>
	</tr>
	<tr>
		<td>歪率</td>
		<td>
				測定中の歪率(THD)を表示します。</td>
	</tr>
</table>
