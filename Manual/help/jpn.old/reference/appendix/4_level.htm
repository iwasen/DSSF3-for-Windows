<h5>テストCDの紹介</h5>
SGを使用しなくても、ピンクノイズや正弦波などの試験信号が集録されたCDをCDプレーヤーで再生すれば同様のテストができます。歪みのない、フラットな特性の信号を再生できるため、テスト信号としては理想的です。このようなCDを作るのは機材や技術がいるため、たとえDSSF3を持っていたとしてもひとつは購入されることをお薦めします。騒音計と並んで最も有用な音響測定機材です。測定システムの初期測定や調整、カーステレオやホームオーディオなど、音楽CDを使用できる環境では必須です。<br />
