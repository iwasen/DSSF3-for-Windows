<h5>ピンクノイズ</h5>
		<p>
				ピンクノイズをFFT分析して周波数特性を測定し、グラフ表示します。<br />
				<br />
				<b>『ピンクノイズ』設定項目の説明</b><br />
				<img alt="ピンクノイズ" src="../img/fre_4.png" /><br />
				<table>
						<tr>
								<th colspan="2">
										項目</th>
								<th>
										説明</th>
						</tr>
						<tr>
								<td rowspan="4" style="width: 67px">
										測定条件</td>
								<td style="width: 55px">
										開始</td>
								<td>
										表示する最小の周波数を入力します。</td>
						</tr>
						<tr>
								<td style="width: 55px">
										終了</td>
								<td>
										表示する最大の周波数を入力します。</td>
						</tr>
						<tr>
								<td style="width: 55px">
										分解能</td>
								<td>
										周波数の分解能を選択します。分解能を大きくするほど高精度で測定できますが、表示の更新レートが遅くなります。</td>
						</tr>
						<tr>
								<td style="width: 55px">
										平均化</td>
								<td>
										移動平均によりグラフの不規則な変動を抑え、滑らかに表示します。</td>
						</tr>
						<tr>
								<td colspan="2">
										出力レベル</td>
								<td>
										測定するレベルを設定します。</td>
						</tr>
				</table>
		</p>


<p class="rt">DSSF3 &gt; <a href="../../index.htm">RA</a> &gt; <a href="../index.htm">リファレンス</a> &gt; <a href="index.htm">周波数特性</a></p>
