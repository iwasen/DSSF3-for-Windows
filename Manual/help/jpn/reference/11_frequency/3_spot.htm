<h5>スポット周波数</h5>
<div class="para">
周波数を段階的に変えながら周波数特性を測定し、グラフ表示します。
</div>
<div class="cap">『スポット周波数』設定項目の説明</div>
<div class="para">
	<img alt="スポット周波数" src="../img/fre_3.png" />
	<table>
		<tr>
			<th colspan="2">項目</th>
			<th>説明</th>
		</tr>
		<tr>
			<td rowspan="4" style="width: 67px">測定条件</td>
			<td style="width: 55px">開始</td>
			<td>測定を開始する周波数を入力します。</td>
		</tr>
		<tr>
			<td style="width: 55px">終了</td>
			<td>測定を終了する周波数を入力します。</td>
		</tr>
		<tr>
			<td style="width: 55px">測定点数</td>
			<td>開始周波数から終了周波数の間の測定点数を入力します。</td>
		</tr>
		<tr>
			<td style="width: 55px">周波数</td>
			<td>測定中の周波数を表示します。</td>
		</tr>
		<tr>
			<td colspan="2">出力レベル</td>
			<td>測定するレベルを設定します。</td>
		</tr>
	</table>
</div>
