<h5>機器の接続</h5>
<div class="cap">接続例</div>
<div class="para">
以下に示す接続図のように、サウンドカードのInputとOutputにマイクとスピーカをそれぞれ接続してください。2本のマイクを使用すると両耳インパルス応答が測定できますが、１本でも測定可能です。その場合、接続されたチャンネルのインパルス応答のみ測定されます。測定信号は左チャンネルに出力されますので、スピーカは左チャンネルに接続してください。
