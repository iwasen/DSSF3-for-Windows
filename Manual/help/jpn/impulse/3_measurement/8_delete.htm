<h5>測定データの削除</h5>
<div class="para">
測定したインパルス応答データを削除する場合は[読込]ボタンをクリックしてください。「測定データ読込み」ダイアログが開きます。削除するデータのフォルダとデータを選択して、[削除]ボタンをクリックします。
<img class="block" src="../img/measurement_11.png" />
</div>
<div class="para">
フォルダを削除する場合は[フォルダ管理ボタン]をクリックしてください。「フォルダ管理」ダイアログが開きます。削除するフォルダを選択して[削除]ボタンをクリックします。
<img class="block" src="../img/measurement_12.png" />
</div>
